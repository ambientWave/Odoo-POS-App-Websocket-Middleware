services:
  fastapi-bridge:
    build: .
    container_name: secure_bridge
    # ports:
    #   - "127.0.0.1:8000:8000"
    expose:
      - 8000
    environment:
      - NEWLEAP_TOKEN=${NEWLEAP_TOKEN:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJCZXN0R2FzVGVzdCIsImlhdCI6MTc2NzA4Mjk3Mn0.m1RBo7kgOT3J0qFmeW2oevkgukukEklWw6C4njMfMS4}
      - ODOO_BASE_URL=${ODOO_BASE_URL:-http://odoo:8069}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    restart: always
    depends_on:
      - redis
      - odoo
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:alpine
    container_name: redis_broker
    restart: always
    expose:
      - 6379

  postgres:
    image: postgres:15-alpine
    container_name: odoo_postgres
    environment:
      - POSTGRES_DB=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    expose:
      - 5432

  odoo:
    image: odoo:18
    container_name: odoo_server
    depends_on:
      - postgres
    environment:
      - HOST=postgres
      - USER=odoo
      - PASSWORD=${POSTGRES_PASSWORD:-odoo}
    volumes:
      - ./intgration_newleap:/mnt/extra-addons/intgration_newleap
      - odoo_data:/var/lib/odoo
    restart: always
    expose:
      - 8069
    command: odoo --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons


  nginx:
    build:
      context: .
      dockerfile: Nginx.Dockerfile
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    # Simplified command for self-signed certs
    command: nginx -g 'daemon off;'
    depends_on:
      fastapi-bridge:
        condition: service_started
      redis:
        condition: service_started
      odoo:
        condition: service_started
    restart: always

volumes:
  postgres_data:
  odoo_data:

networks:
  default:
    name: odoo_network
