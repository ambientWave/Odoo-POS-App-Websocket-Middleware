load_module modules/ngx_http_headers_more_filter_module.so;
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # SECURITY MODIFICATION: Hide Nginx version in response headers
    server_tokens off;
    more_clear_headers Server;
    # Logging setup
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Map for WebSocket $connection_upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream fastapi_server {
        server fastapi-bridge:8000;
        keepalive 32; # Keep connections open to the backend
    }

    # # SECURITY MODIFICATION: This block intends to drop connections from scanners
    # server {
    #     listen 80 default_server;
    #     listen 443 ssl default_server;
    #     server_name "";
    #     return 444; # Connection closed without response
    # }

    # HTTP server - Redirect all traffic to HTTPS
    # Security note: This catch-all block redirects any HTTP request to HTTPS.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name 149.104.105.40;
        return 301 https://$host$request_uri;

        # location / {
        #     # EXPERT TIP: Prevent redirect loops when behind ngrok/load balancers.
        #     if ($http_x_forwarded_proto = "http") {
        #         return 301 https://$host$request_uri;
        #     }
        #     proxy_pass http://fastapi_server;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection $connection_upgrade;
            
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
            
        #     # WebSocket specific timeouts
        #     proxy_read_timeout 3600s;
        #     proxy_send_timeout 3600s;
        # }
    }

    # HTTPS server
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        
        # SECURITY MODIFICATION: Replace '_' with your actual VPS IP address if possible.
        # This prevents the server from responding to unintended hostnames.
        server_name 149.104.105.40;

        # SSL Configuration
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_password_file /etc/nginx/certs/passphrase.txt;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off; # Recommended for TLS 1.3
        # ssl_prefer_server_ciphers on;
        # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        
        # SECURITY MODIFICATION: Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always; # Prevents Clickjacking.
        add_header X-Content-Type-Options "nosniff" always; # Prevents MIME type sniffing.
        add_header X-XSS-Protection "1; mode=block" always; # Prevents XSS attacks.
        add_header Referrer-Policy "no-referrer-when-downgrade" always; # Prevents Referrer Leakage.
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'self';" always; # Prevents XSS attacks. Restricts where resources can be loaded from.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # Prevents SSL stripping attacks. Tells browsers to always use HTTPS (note: users will still see a warning for self-signed certs).
        
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Main application routing
        location / {
            # SECURITY MODIFICATION:Limit request body size to prevent buffer overflow/DoS
            client_max_body_size 1M;

            proxy_pass http://fastapi_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # WebSocket dedicated routing
        location /ws/events {
            proxy_pass http://fastapi_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # WebSocket specific timeouts - Kept long for connection durability
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
